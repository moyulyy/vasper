<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vasper Viewer</title>
<style>
  :root {
    --surface: #FFFFFF;
    --canvas: #FBFBFD;
    --surface-alt: #F4F5F9;
    --text: #111114;
    --muted: #8A8A8E;
    --faint: #B0B0B8;
    --border: #E7E7ED;
    --accent: #0A84FF;
    --accent-soft: #E9F2FF;
    --glass: rgba(255, 255, 255, 0.94);
    --shadow: 0 8px 28px rgba(17, 24, 39, 0.08);
  }
  body.dark {
    --surface: #17191F;
    --canvas: #101116;
    --surface-alt: #20232B;
    --text: #F5F5F7;
    --muted: #8E8E93;
    --faint: #636366;
    --border: #262932;
    --accent: #0A84FF;
    --accent-soft: #122A42;
    --glass: rgba(23, 25, 31, 0.94);
    --shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: var(--surface);
    font-family: "PingFang SC", "SF Pro Text", "Noto Sans CJK SC", "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  #stage { position: absolute; inset: 0; padding: 0 6px 6px 6px; }
  #viewer {
    position: absolute; inset: 6px 6px 6px 6px;
    border-radius: 14px;
    background: var(--canvas);
    overflow: hidden;
  }
  .glass {
    background: var(--glass);
    border: 1px solid var(--border);
    border-radius: 13px;
    box-shadow: var(--shadow);
  }

  /* 空状态 */
  #empty {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 6px;
    pointer-events: none; padding: 20px; text-align: center;
  }
  #empty .orb {
    position: relative; width: 96px; height: 96px; margin-bottom: 18px;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 26%, #ffffff, #DCEBFF 38%, #0A84FF 105%);
    box-shadow: inset -12px -14px 26px rgba(10, 132, 255, 0.22),
                0 18px 46px rgba(10, 132, 255, 0.22);
    animation: float 5s ease-in-out infinite;
  }
  body.dark #empty .orb {
    background: radial-gradient(circle at 32% 26%, #6FAEFF, #1E4E86 42%, #0A2A4A 100%);
    box-shadow: inset -12px -14px 26px rgba(0, 0, 0, 0.4), 0 18px 50px rgba(10, 132, 255, 0.25);
  }
  #empty .orb::before, #empty .orb::after {
    content: ""; position: absolute; border-radius: 50%;
    border: 1px solid rgba(10, 132, 255, 0.28);
  }
  #empty .orb::before { inset: -14px; animation: spin 14s linear infinite; }
  #empty .orb::after {
    inset: -26px; border-style: dashed; border-color: rgba(94, 92, 230, 0.25);
    animation: spin 22s linear infinite reverse;
  }
  #empty .orb span {
    position: absolute; top: 18px; left: 22px; width: 18px; height: 18px;
    border-radius: 50%; background: rgba(255, 255, 255, 0.85);
    filter: blur(1px);
  }
  #empty h2 { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: 0.2px; }
  #empty p { margin: 4px 0 0; font-size: 12px; color: var(--muted); line-height: 1.7; max-width: 330px; }
  #empty .kbd {
    display: inline-flex; gap: 6px; margin-top: 16px; align-items: center;
    font-size: 11px; color: var(--muted);
  }
  #empty .kbd b {
    font-weight: 500; background: var(--surface-alt); border: 1px solid var(--border);
    border-radius: 7px; padding: 3px 8px; color: var(--text);
  }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 图例 */
  #legend {
    position: absolute; top: 14px; right: 14px; z-index: 5;
    min-width: 148px; max-width: 210px; padding: 11px 12px 10px;
    display: none;
  }
  #legend.show { display: block; }
  #legend .head {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 9px; letter-spacing: 1.4px; color: var(--muted);
    text-transform: uppercase; margin-bottom: 7px; font-weight: 600;
  }
  #legend .head span:last-child { letter-spacing: 0; font-weight: 500; }
  #legend .rows { max-height: min(230px, 34vh); overflow-y: auto; }
  #legend .row {
    display: flex; align-items: center; gap: 8px; padding: 3px 0;
    font-size: 11px; color: var(--text);
  }
  #legend .dot {
    width: 13px; height: 13px; border-radius: 50%; flex: 0 0 13px;
    border: 1px solid rgba(0,0,0,0.12);
    background-image: radial-gradient(circle at 30% 25%, rgba(255,255,255,0.75), transparent 62%);
  }
  #legend .row b { font-weight: 600; }
  #legend .row em { margin-left: auto; color: var(--muted); font-style: normal; font-size: 10px; }

  /* 底部提示 */
  #hint {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    z-index: 4; padding: 7px 14px; border-radius: 999px;
    font-size: 10.5px; color: var(--muted); white-space: nowrap;
    background: var(--glass); border: 1px solid var(--border);
    transition: opacity .35s ease;
  }
  #hint.hide { opacity: 0; }

  /* 缩放 */
  #zoom {
    position: absolute; right: 14px; bottom: 14px; z-index: 4;
    display: flex; flex-direction: column; overflow: hidden;
    border-radius: 11px;
  }
  #zoom button {
    width: 32px; height: 30px; border: none; background: transparent;
    color: var(--text); font-size: 16px; line-height: 1; cursor: pointer;
  }
  #zoom button:hover { background: var(--accent-soft); color: var(--accent); }
  #zoom button + button { border-top: 1px solid var(--border); }

  /* 原子信息 / 测量 */
  #pick {
    position: absolute; left: 14px; bottom: 14px; z-index: 5;
    padding: 10px 12px; min-width: 158px; display: none;
  }
  #pick.show { display: block; }
  #pick .title {
    display: flex; align-items: center; gap: 7px;
    font-size: 11px; font-weight: 600; margin-bottom: 6px;
  }
  #pick .title .dot { width: 10px; height: 10px; border-radius: 50%; }
  #pick .line {
    display: flex; justify-content: space-between; gap: 16px;
    font-size: 10.5px; color: var(--muted); padding: 1.5px 0;
  }
  #pick .line b { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }
  #pick .measure {
    margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--border);
    font-size: 12px; font-weight: 600; color: #FF9F0A;
  }
  #pick .measure small {
    display: block; font-weight: 400; color: var(--muted); font-size: 10px; margin-top: 2px;
  }
</style>
<script src="3Dmol-min.js"></script>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
</head>
<body class="dark">
  <div id="stage">
    <div id="viewer"></div>

    <div id="empty">
      <div class="orb"><span></span></div>
      <h2>选择一个结构文件</h2>
      <p>从左侧文件树打开 CIF、XYZ、PDB、POSCAR 等结构，<br>在这里旋转、缩放、测量并交给 AI 分析。</p>
      <div class="kbd"><b>拖动</b> 旋转 <b>滚轮</b> 缩放 <b>右键</b> 平移</div>
    </div>

    <aside id="legend" class="glass">
      <div class="head"><span>元素 / ELEMENTS</span><span id="legendTotal"></span></div>
      <div class="rows" id="legendRows"></div>
    </aside>

    <div id="pick" class="glass"></div>

    <div id="zoom" class="glass">
      <button id="zoomIn" title="放大">+</button>
      <button id="zoomOut" title="缩小">−</button>
    </div>

    <div id="hint">拖动旋转 · 滚轮缩放 · 右键平移 · 点击原子查看信息</div>
  </div>
  <script src="viewer.js"></script>
</body>
</html>
